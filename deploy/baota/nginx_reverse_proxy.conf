# ==============================================================================
# PolyQuant 5M - 宝塔面板 (aaPanel) Nginx 反向代理配置模板
# ==============================================================================
# 使用方法：
# 1. 在宝塔面板「网站」->「添加站点」创建您的域名站点 (例如: quant.yourdomain.com)
# 2. 点击「设置」->「反向代理」->「添加反向代理」
#    - 代理名称: polyquant
#    - 目标 URL: http://127.0.0.1:8080
#    - 发送域名: $host
# 3. 点击「配置文件」，用以下内容完整替换保存即可。
# ==============================================================================

location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header REMOTE-HOST $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --------------------------------------------------------------------------
    # 核心：全双工 WebSocket 长连接升级支持 (用于 /api/v1/ws 毫秒级推流)
    # --------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 关闭反代缓冲，保证 500ms 行情与策略决策信号零延迟直达浏览器
    proxy_buffering off;
    proxy_cache off;

    # 防止长连接被 Nginx 超时中断 (设置 24 小时心跳保活)
    proxy_connect_timeout 60s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # 支持浏览器路由历史（SPA 路由支持）
    proxy_intercept_errors off;
}
