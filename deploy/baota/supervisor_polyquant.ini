[program:polyquant]
command=/opt/polyquant/bin/poly_quant_backend
directory=/opt/polyquant
user=root
autostart=true
autorestart=true
startsecs=5
startretries=5
redirect_stderr=true
stdout_logfile=/opt/polyquant/logs/supervisor.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=APP_CONFIG_PATH="/opt/polyquant/config/config.yaml",FRONTEND_DIST_PATH="/opt/polyquant/frontend/dist",RUST_LOG="info,poly_quant_backend=debug,tower_http=info"
